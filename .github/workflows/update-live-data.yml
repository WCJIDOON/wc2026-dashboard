name: Update WC2026 Live Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-live-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest standings
        run: node scripts/update-live-data.mjs

      - name: Commit updated data
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain wc2026_live_data.js)" ]]; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wc2026_live_data.js
          git commit -m "Update WC2026 live data"
          git push
