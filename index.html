<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026 월드컵 조별리그 현황</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10151b;
      --panel: #182129;
      --panel-2: #202b35;
      --line: #344453;
      --text: #eef4f7;
      --muted: #9fb0ba;
      --accent: #e0b649;
      --good: #55c79b;
      --warn: #e17f63;
      --blue: #70a6d8;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    }
    body { padding: 18px; overflow-x: hidden; }
    .shell { max-width: 1320px; margin: 0 auto; }

    .top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }
    h1 { margin: 0; font-size: 27px; line-height: 1.1; letter-spacing: 0; }
    .sub { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .stamp {
      text-align: right;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      white-space: nowrap;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 12px;
    }
    .chip {
      border: 1px solid var(--line);
      background: #15202a;
      color: var(--text);
      border-radius: 999px;
      padding: 4px 9px;
    }
    .chip.good { color: #c9f4e5; border-color: rgba(85, 199, 155, .55); }
    .chip.warn { color: #ffd7ca; border-color: rgba(225, 127, 99, .55); }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(260px, 1fr));
      gap: 12px;
    }
    .group {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0, 0, 0, .18);
    }
    .group-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: linear-gradient(90deg, #243342, #1a2730);
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
    }
    .group-name { font-weight: 800; color: var(--accent); font-size: 15px; }
    .group-status { color: var(--muted); font-size: 11px; }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
    th {
      color: var(--muted);
      font-weight: 700;
      font-size: 10px;
      padding: 6px 4px;
      border-bottom: 1px solid #263542;
      text-align: center;
    }
    th.team, td.team { text-align: left; width: auto; padding-left: 10px; }
    th.num, td.num { width: 31px; }
    th.pts, td.pts { width: 36px; }
    td {
      padding: 7px 4px;
      border-bottom: 1px solid #24323e;
      color: #dce7ec;
      text-align: center;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: none; }
    td.team {
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
      font-weight: 700;
    }
    .team-wrap {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      min-width: 0;
      vertical-align: middle;
    }
    .flag {
      width: 19px;
      height: 13px;
      flex: none;
      border-radius: 2px;
      object-fit: cover;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .16);
      background: #0c1116;
    }
    .team-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    tr.qual td:first-child::before,
    tr.third td:first-child::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 6px;
      border-radius: 50%;
      vertical-align: middle;
    }
    tr.qual td:first-child::before { background: var(--good); }
    tr.third td:first-child::before { background: var(--warn); }
    td.pts { color: var(--accent); font-weight: 900; }

    .matches {
      background: #131b22;
      border-top: 1px solid var(--line);
      padding: 8px 10px 10px;
    }
    .matches-title {
      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 5px;
    }
    .match {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      padding: 2px 0;
    }
    .time { color: #dbe8ef; font-weight: 800; font-variant-numeric: tabular-nums; }
    .teams {
      color: #cbd8de;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .korea {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .k-card {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .k-date { color: var(--accent); font-size: 12px; font-weight: 900; margin-bottom: 5px; }
    .k-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
    .k-meta { color: var(--muted); font-size: 12px; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 0 0 14px;
    }
    .stat-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .stat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      background: #17232c;
      border-bottom: 1px solid var(--line);
    }
    .stat-title {
      color: var(--accent);
      font-size: 14px;
      font-weight: 900;
    }
    .stat-note {
      color: var(--muted);
      font-size: 11px;
    }
    .rank-list {
      display: grid;
      gap: 0;
    }
    .rank-row {
      display: grid;
      grid-template-columns: 30px 1fr 42px;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 6px 10px;
      border-bottom: 1px solid #24323e;
      font-size: 12px;
    }
    .rank-row:last-child { border-bottom: none; }
    .rank-num {
      color: var(--muted);
      font-weight: 900;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .player {
      min-width: 0;
      overflow: hidden;
    }
    .player-name {
      color: var(--text);
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .player-team {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rank-score {
      color: var(--accent);
      font-size: 16px;
      font-weight: 900;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .empty-stat {
      color: var(--muted);
      padding: 18px 12px;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 1180px) { .grid { grid-template-columns: repeat(3, minmax(240px, 1fr)); } }
    @media (max-width: 880px) {
      body { padding: 12px; }
      .top { align-items: start; flex-direction: column; gap: 8px; }
      .stamp { text-align: left; }
      .grid { grid-template-columns: repeat(2, minmax(220px, 1fr)); }
      .stats-grid { grid-template-columns: 1fr; }
      .korea { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>

      ["J", "06/23 02:00", "아르헨티나 대 오스트리아"],
      ["J", "06/28 11:00", "요르단 대 아르헨티나"],
      ["K", "06/18 02:00", "포르투갈 대 콩고민주공화국"],
      ["K", "06/18 11:00", "우즈베키스탄 대 콜롬비아"],
      ["K", "06/24 02:00", "포르투갈 대 우즈베키스탄"],
      ["K", "06/28 08:30", "콜롬비아 대 포르투갈"],
      ["L", "06/18 05:00", "잉글랜드 대 크로아티아"],
      ["L", "06/18 08:00", "가나 대 파나마"],
      ["L", "06/24 05:00", "잉글랜드 대 가나"],
      ["L", "06/28 06:00", "파나마 대 잉글랜드"]
    ];

    const KOREA = [
      ["2026년 6월 12일 11:00", "대한민국 대 체코", "과달라하라"],
      ["2026년 6월 19일 10:00", "멕시코 대 대한민국", "과달라하라"],
      ["2026년 6월 25일 10:00", "대한민국 대 남아프리카공화국", "몬테레이"]
    ];

    function esc(text) {
      return String(text).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);
    }

    function num(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }

    function teamName(name) {
      return KO_NAME[name] || name;
    }

    function flagFor(team) {
      if (!team) return "";
      if (typeof team === "object") return team.flag || STATIC_FLAGS[team.name] || "";
      return STATIC_FLAGS[team] || "";
    }

    function teamCell(row) {
      const name = typeof row === "object" ? row.team : row;
      const flag = flagFor(row);
      const image = flag ? `<img class="flag" src="${esc(flag)}" alt="" loading="lazy">` : "";
      return `<span class="team-wrap">${image}<span class="team-label">${esc(name)}</span></span>`;
    }

    function liveStandings() {
      const data = window.WC2026_LIVE_DATA;
      if (!data || !data.groups || !data.teams) return null;

      const teams = {};
      for (const t of data.teams.teams || []) {
        const name = teamName(t.name_en);
        teams[String(t.id)] = {
          name,
          flag: t.flag || STATIC_FLAGS[name] || ""
        };
      }

      const standings = {};
      for (const group of data.groups.groups || []) {
        const letter = String(group.name || "").toUpperCase();
        if (!GROUPS[letter]) continue;
        standings[letter] = (group.teams || []).map((row) => ({
          team: (teams[String(row.team_id)] || {}).name || String(row.team_id),
          flag: (teams[String(row.team_id)] || {}).flag || "",
          p: num(row.mp),
          w: num(row.w),
          d: num(row.d),
          l: num(row.l),
          gd: num(row.gd),
          pts: num(row.pts),
          gf: num(row.gf)
        })).sort((a, b) =>
          b.pts - a.pts ||
          b.gd - a.gd ||
          b.gf - a.gf ||
          a.team.localeCompare(b.team, "ko")
        );
      }

      return { standings, fetchedAt: data.fetchedAt || "" };
    }

    function rowsForGroup(letter, live) {
      if (live && live.standings[letter] && live.standings[letter].length) {
        return live.standings[letter];
      }
      return GROUPS[letter].map((team) => ({ team, flag: STATIC_FLAGS[team] || "", p: 0, w: 0, d: 0, l: 0, gd: 0, pts: 0 }));
    }

    function renderGroups(live) {
      const root = document.getElementById("groups");
      root.innerHTML = Object.keys(GROUPS).map((letter) => {
        const groupRows = rowsForGroup(letter, live);
        const played = Math.round(groupRows.reduce((sum, row) => sum + num(row.p), 0) / 2);
        const rows = groupRows.map((row, index) => {
          const cls = index < 2 ? "qual" : index === 2 ? "third" : "";
          const gd = num(row.gd) > 0 ? `+${num(row.gd)}` : String(num(row.gd));
          return `<tr class="${cls}">
            <td class="team">${teamCell(row)}</td>
            <td class="num">${num(row.p)}</td>
            <td class="num">${num(row.w)}</td>
            <td class="num">${num(row.d)}</td>
            <td class="num">${num(row.l)}</td>
            <td class="num">${esc(gd)}</td>
            <td class="pts">${num(row.pts)}</td>
          </tr>`;
        }).join("");

        const matches = FIXTURES.filter((m) => m[0] === letter).slice(0, 4).map((m) => `
          <div class="match"><span class="time">${esc(m[1])}</span><span class="teams">${esc(m[2])}</span></div>
        `).join("");

        return `<article class="group">
          <div class="group-head">
            <div class="group-name">${letter}조</div>
            <div class="group-status">${played}/6 경기</div>
          </div>
          <table>
            <thead>
              <tr><th class="team">대표팀</th><th class="num">P</th><th class="num">W</th><th class="num">D</th><th class="num">L</th><th class="num">GD</th><th class="pts">Pts</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="matches">
            <div class="matches-title">주요 일정</div>
            ${matches}
          </div>
        </article>`;
      }).join("");
    }

    function cleanPlayerName(value) {
      return String(value || "")
        .replace(/\([^)]*\d+[^)]*\)/g, "")
        .replace(/\b\d+\+?\d*'?/g, "")
        .replace(/\b(PEN|Penalty|penalty|OG|Own Goal|own goal)\b/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function parsePeople(raw) {
      if (raw == null) return [];
      if (Array.isArray(raw)) return raw.map(cleanPlayerName).filter(Boolean);

      const text = String(raw).trim();
      if (!text || text === "null" || text === "[]" || text === "-") return [];

      try {
        const parsed = JSON.parse(text);
        if (Array.isArray(parsed)) return parsed.map(cleanPlayerName).filter(Boolean);
      } catch (_) {
        // Plain scorer strings are expected from the free API.
      }

      return text
        .split(/[,;|،]+/)
        .map(cleanPlayerName)
        .filter(Boolean);
    }

    function addPlayerCount(map, player, team, flag) {
      const name = cleanPlayerName(player);
      if (!name) return;
      const key = `${name}__${team}`;
      const current = map.get(key) || { name, team, flag, count: 0 };
      current.count += 1;
      map.set(key, current);
    }

    function collectRankings(live, type) {
      const data = window.WC2026_LIVE_DATA;
      const games = data && data.games && Array.isArray(data.games.games) ? data.games.games : [];
      const rankings = new Map();

      for (const game of games) {
        const homeTeam = teamName(game.home_team_name_en || "");
        const awayTeam = teamName(game.away_team_name_en || "");
        const homeFlag = STATIC_FLAGS[homeTeam] || "";
        const awayFlag = STATIC_FLAGS[awayTeam] || "";

        if (type === "goals") {
          for (const player of parsePeople(game.home_scorers)) addPlayerCount(rankings, player, homeTeam, homeFlag);
          for (const player of parsePeople(game.away_scorers)) addPlayerCount(rankings, player, awayTeam, awayFlag);
          continue;
        }

        const homeAssistKeys = Object.keys(game).filter((key) => /^home_.*assist/i.test(key));
        const awayAssistKeys = Object.keys(game).filter((key) => /^away_.*assist/i.test(key));
        for (const key of homeAssistKeys) {
          for (const player of parsePeople(game[key])) addPlayerCount(rankings, player, homeTeam, homeFlag);
        }
        for (const key of awayAssistKeys) {
          for (const player of parsePeople(game[key])) addPlayerCount(rankings, player, awayTeam, awayFlag);
        }
      }

      return Array.from(rankings.values())
        .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, "ko"))
        .slice(0, 8);
    }

    function renderRanking(targetId, noteId, rows, unit, emptyText) {
      const target = document.getElementById(targetId);
      const note = document.getElementById(noteId);
      note.textContent = rows.length ? `상위 ${rows.length}명` : "데이터 대기 중";

      if (!rows.length) {
        target.innerHTML = `<div class="empty-stat">${esc(emptyText)}</div>`;
        return;
      }

      target.innerHTML = rows.map((row, index) => `
        <div class="rank-row">
          <div class="rank-num">${index + 1}</div>
          <div class="player">
            <div class="player-name">${esc(row.name)}</div>
            <div class="player-team">${teamCell({ team: row.team, flag: row.flag })}</div>
          </div>
          <div class="rank-score">${row.count}${esc(unit)}</div>
        </div>
      `).join("");
    }

    function renderStats(live) {
      const scorers = collectRankings(live, "goals");
      const assists = collectRankings(live, "assists");
      renderRanking("scorers", "scorerNote", scorers, "골", "대회 시작 후 득점자가 집계됩니다.");
      renderRanking("assists", "assistNote", assists, "도움", "공개 API에 도움 데이터가 제공되면 자동 표시됩니다.");
    }

    function renderKorea() {
      document.getElementById("korea").innerHTML = KOREA.map((m) => `
        <article class="k-card">
          <div class="k-date">${esc(m[0])}</div>
          <div class="k-title">${esc(m[1])}</div>
          <div class="k-meta">${esc(m[2])}</div>
        </article>
      `).join("");
    }

    function renderStatus(live) {
      const el = document.getElementById("dataStatus");
      if (!live || !live.fetchedAt) {
        el.textContent = "오프라인 정적 데이터";
        return;
      }
      const date = new Date(live.fetchedAt);
      const label = Number.isFinite(date.getTime())
        ? new Intl.DateTimeFormat("ko-KR", {
            month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
          }).format(date)
        : live.fetchedAt;
      el.textContent = `온라인 갱신: ${label}`;
    }

    function startDashboard() {
      document.getElementById("today").textContent = new Intl.DateTimeFormat("ko-KR", {
        year: "numeric", month: "long", day: "numeric", weekday: "short"
      }).format(new Date());

      const live = liveStandings();
      renderStats(live);
      renderGroups(live);
      renderKorea();
      renderStatus(live);

      setTimeout(() => {
        window.location.reload();
      }, 5 * 60 * 1000);
    }

    function loadLiveData() {
      const script = document.createElement("script");
      script.src = `wc2026_live_data.js?v=${Date.now()}`;
      script.onload = startDashboard;
      script.onerror = startDashboard;
      document.head.appendChild(script);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", loadLiveData);
    } else {
      loadLiveData();
    }
  </script>
</body>
</html>
