<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026 월드컵 종료</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10151b;
      --panel: #182129;
      --line: #344453;
      --text: #eef4f7;
      --muted: #9fb0ba;
      --accent: #e0b649;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(224, 182, 73, 0.18), transparent 32%),
        linear-gradient(180deg, #10151b, #0b1015);
      color: var(--text);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    }

    main {
      width: min(680px, 100%);
      text-align: center;
      background: rgba(24, 33, 41, 0.92);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 48px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 56px);
      line-height: 1.1;
      color: var(--accent);
    }

    p {
      margin: 18px 0 0;
      font-size: clamp(18px, 3vw, 24px);
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>2026 우승팀 스페인</h1>
    <p>다음 월드컵을 기대해주세요</p>
  </main>
</body>
</html>
