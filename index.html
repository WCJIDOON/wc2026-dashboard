<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026 월드컵 조별리그 현황</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07110e;
      --panel: rgba(20, 31, 38, .9);
      --panel-2: rgba(28, 41, 48, .9);
      --line: rgba(74, 101, 110, .78);
      --text: #eef4f7;
      --muted: #9fb0ba;
      --accent: #e0b649;
      --good: #55c79b;
      --warn: #e17f63;
      --blue: #70a6d8;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    }
    body {
      position: relative;
      padding: 18px;
      overflow-x: hidden;
      background:
        linear-gradient(180deg, #07110e 0%, #10241d 42%, #07100d 100%);
    }
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    body::before {
      z-index: 0;
      background:
        linear-gradient(115deg, rgba(232, 197, 95, .22) 0%, rgba(232, 197, 95, 0) 24%),
        linear-gradient(245deg, rgba(112, 166, 216, .18) 0%, rgba(112, 166, 216, 0) 28%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .045) 0 1px, transparent 1px 78px),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 58px),
        linear-gradient(180deg, rgba(255, 255, 255, .05), transparent 28%),
        linear-gradient(180deg, rgba(8, 24, 20, .15), rgba(8, 24, 20, .88));
    }
    body::after {
      z-index: 0;
      opacity: .6;
      background:
        linear-gradient(90deg, transparent 0 8%, rgba(255, 255, 255, .08) 8% 8.2%, transparent 8.2% 91.8%, rgba(255, 255, 255, .08) 91.8% 92%, transparent 92%),
        linear-gradient(0deg, transparent 0 64%, rgba(255, 255, 255, .07) 64% 64.4%, transparent 64.4%),
        repeating-linear-gradient(135deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 13px);
      mask-image: linear-gradient(180deg, transparent 0%, black 16%, black 92%, transparent 100%);
    }
    body.modal-open { overflow: hidden; }
    .shell { max-width: 1320px; margin: 0 auto; position: relative; z-index: 1; }

    .top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }
    h1 { margin: 0; font-size: 27px; line-height: 1.1; letter-spacing: 0; }
    .sub { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .stamp {
      text-align: right;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      white-space: nowrap;
    }
    #dataStatus {
      font-weight: 800;
    }
    #dataStatus.status-ok { color: #c9f4e5; }
    #dataStatus.status-warn { color: #ffe1a6; }
    #dataStatus.status-stale { color: #ffd7ca; }
    #dataStatus.status-static { color: var(--muted); }

    .countdown-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 520px);
      align-items: center;
      gap: 14px;
      margin: 0 0 14px;
      padding: 14px 16px;
      background: rgba(14, 24, 29, .9);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, .14);
    }
    .countdown-card.is-live {
      border-left-color: var(--good);
    }
    .countdown-kicker {
      color: var(--accent);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.3;
    }
    .countdown-card.is-live .countdown-kicker {
      color: #c9f4e5;
    }
    .countdown-title {
      margin-top: 3px;
      color: var(--text);
      font-size: 21px;
      font-weight: 900;
      line-height: 1.15;
    }
    .countdown-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .countdown-unit {
      min-width: 0;
      background: #0f161d;
      border: 1px solid #293845;
      border-radius: 8px;
      padding: 10px 8px;
      text-align: center;
    }
    .countdown-value {
      display: block;
      color: var(--text);
      font-size: 27px;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .countdown-label {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 12px;
    }
    .chip {
      border: 1px solid var(--line);
      background: #15202a;
      color: var(--text);
      border-radius: 999px;
      padding: 4px 9px;
    }
    .chip.good { color: #c9f4e5; border-color: rgba(85, 199, 155, .55); }
    .chip.warn { color: #ffd7ca; border-color: rgba(225, 127, 99, .55); }

    .today-match {
      background: rgba(14, 24, 29, .9);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin: 0 0 14px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, .14);
    }
    .today-top {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin-bottom: 10px;
    }
    .today-title {
      color: var(--accent);
      font-size: 16px;
      font-weight: 900;
      line-height: 1.2;
    }
    .today-sub,
    .today-count {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }
    .today-count {
      text-align: right;
      white-space: nowrap;
    }
    .today-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
    }
    .today-card {
      min-width: 0;
      background: var(--panel);
      border: 1px solid #2b3a46;
      border-radius: 8px;
      padding: 10px;
    }
    .today-card.live {
      border-color: rgba(85, 199, 155, .55);
      box-shadow: inset 0 0 0 1px rgba(85, 199, 155, .12);
    }
    .today-card.done { opacity: .82; }
    .today-time {
      color: var(--blue);
      font-size: 12px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .today-teams {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .today-side {
      min-width: 0;
      font-size: 13px;
      font-weight: 800;
    }
    .today-side.away {
      text-align: right;
    }
    .today-side.away .team-wrap {
      justify-content: flex-end;
    }
    .lineup-trigger {
      appearance: none;
      width: 100%;
      min-width: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      padding: 3px;
      border-radius: 6px;
      cursor: pointer;
    }
    .lineup-trigger:hover {
      background: rgba(224, 182, 73, .1);
    }
    .lineup-trigger:focus-visible {
      outline: 2px solid rgba(224, 182, 73, .75);
      outline-offset: 2px;
    }
    .today-score {
      min-width: 42px;
      color: var(--text);
      background: #0f161d;
      border: 1px solid #293845;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 900;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .today-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }
    .today-potm {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      align-items: center;
      gap: 9px;
      margin-top: 10px;
      padding: 8px;
      color: inherit;
      text-decoration: none;
      background: rgba(224, 182, 73, .1);
      border: 1px solid rgba(224, 182, 73, .28);
      border-radius: 8px;
    }
    .today-potm-avatar,
    .today-potm-initial {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: #101820;
      border: 1px solid rgba(224, 182, 73, .4);
    }
    .today-potm-avatar {
      display: block;
      overflow: hidden;
    }
    .today-potm-photo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 4%;
      transform: scale(4.1);
      transform-origin: 50% 6%;
    }
    .today-potm-initial {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 15px;
      font-weight: 900;
    }
    .today-potm-kicker {
      display: block;
      color: var(--accent);
      font-size: 10px;
      font-weight: 900;
      line-height: 1.2;
    }
    .today-potm-name {
      display: block;
      margin-top: 2px;
      color: var(--text);
      font-size: 13px;
      font-weight: 900;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .today-potm-meta {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
    }
    .today-empty {
      color: var(--muted);
      border: 1px dashed #344453;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      text-align: center;
    }
    .lineup-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      pointer-events: none;
    }
    .lineup-modal.open { display: block; }
    .lineup-dialog {
      position: fixed;
      top: 14px;
      left: 14px;
      width: min(420px, calc(100vw - 28px));
      max-height: min(78vh, 560px);
      overflow: auto;
      background: #131b22;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 58px rgba(0, 0, 0, .48);
      pointer-events: auto;
    }
    .lineup-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--line);
    }
    .lineup-title {
      margin: 0;
      color: var(--accent);
      font-size: 17px;
      line-height: 1.25;
    }
    .lineup-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .lineup-close {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #182129;
      color: var(--text);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    .lineup-body {
      padding: 14px;
    }
    .lineup-team {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 900;
    }
    .lineup-list {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .lineup-player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 34px;
      padding: 8px 10px;
      border: 1px solid #2b3a46;
      border-radius: 8px;
      background: var(--panel);
    }
    .lineup-player-name {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 800;
    }
    .lineup-player-meta {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
    }
    .lineup-empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 16px;
      color: var(--muted);
      line-height: 1.55;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(260px, 1fr));
      gap: 12px;
    }
    .group {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 16px 38px rgba(0, 0, 0, .24);
      backdrop-filter: blur(8px);
    }
    .group-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: linear-gradient(90deg, rgba(36, 58, 55, .95), rgba(25, 38, 45, .95));
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
    }
    .group-name { font-weight: 800; color: var(--accent); font-size: 15px; }
    .group-status { color: var(--muted); font-size: 11px; }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
    th {
      color: var(--muted);
      font-weight: 700;
      font-size: 10px;
      padding: 6px 4px;
      border-bottom: 1px solid #263542;
      text-align: center;
    }
    th.team, td.team { text-align: left; width: auto; padding-left: 10px; }
    th.num, td.num { width: 31px; }
    th.pts, td.pts { width: 36px; }
    td {
      padding: 7px 4px;
      border-bottom: 1px solid #24323e;
      color: #dce7ec;
      text-align: center;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: none; }
    td.team {
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
      font-weight: 700;
    }
    .team-wrap {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      min-width: 0;
      vertical-align: middle;
    }
    .flag {
      width: 19px;
      height: 13px;
      flex: none;
      border-radius: 2px;
      object-fit: cover;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .16);
      background: #0c1116;
    }
    .flag-code {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 27px;
      height: 15px;
      flex: none;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 3px;
      background: #0e1820;
      color: #dce7ec;
      font-size: 8px;
      font-weight: 900;
      line-height: 1;
    }
    .team-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    tr.qual .team-label { color: #76e5bc; }
    tr.third .team-label { color: #ffb08e; }
    td.pts { color: var(--accent); font-weight: 900; }

    .matches {
      background: rgba(12, 22, 25, .76);
      border-top: 1px solid var(--line);
      padding: 8px 10px 10px;
    }
    .matches-title {
      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 5px;
    }
    .match {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      padding: 2px 0;
    }
    .match.done .time,
    .match.done .teams {
      opacity: .62;
      text-decoration: line-through;
      text-decoration-thickness: 1px;
      text-decoration-color: rgba(203, 216, 222, .72);
    }
    .time { color: #dbe8ef; font-weight: 800; font-variant-numeric: tabular-nums; }
    .teams {
      color: #cbd8de;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .match-score {
      color: var(--accent);
      font-size: 11px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .match-winner {
      color: #c9f4e5;
      border: 1px solid rgba(85, 199, 155, .38);
      border-radius: 999px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 900;
      line-height: 1.3;
      white-space: nowrap;
    }
    .match-badge {
      color: #c9f4e5;
      border: 1px solid rgba(85, 199, 155, .38);
      border-radius: 999px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 900;
      line-height: 1.3;
      white-space: nowrap;
    }

    .korea {
      margin: 0 0 14px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .k-card {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .k-date { color: var(--accent); font-size: 12px; font-weight: 900; margin-bottom: 5px; }
    .k-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
    .k-meta { color: var(--muted); font-size: 12px; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 0 0 14px;
    }
    .stat-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .stat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      background: #17232c;
      border-bottom: 1px solid var(--line);
    }
    .stat-title {
      color: var(--accent);
      font-size: 14px;
      font-weight: 900;
    }
    .stat-note {
      color: var(--muted);
      font-size: 11px;
    }
    .rank-list {
      display: grid;
      gap: 0;
    }
    .leader-card {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      margin: 10px;
      padding: 10px;
      background: linear-gradient(135deg, rgba(224, 182, 73, .16), rgba(112, 166, 216, .08));
      border: 1px solid rgba(224, 182, 73, .34);
      border-radius: 8px;
    }
    .leader-photo,
    .leader-initial {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      background: #101820;
      border: 1px solid rgba(224, 182, 73, .42);
    }
    .leader-photo {
      display: block;
      object-fit: cover;
      object-position: center top;
    }
    .leader-initial {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 24px;
      font-weight: 900;
    }
    .leader-kicker {
      color: var(--accent);
      font-size: 11px;
      font-weight: 900;
      line-height: 1.2;
    }
    .leader-info {
      min-width: 0;
    }
    .leader-name {
      margin-top: 4px;
      color: var(--text);
      font-size: 18px;
      font-weight: 900;
      line-height: 1.18;
      overflow-wrap: anywhere;
    }
    .leader-team {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .leader-score {
      color: var(--accent);
      font-size: 28px;
      font-weight: 900;
      line-height: 1;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .leader-unit {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }
    .rank-row {
      display: grid;
      grid-template-columns: 30px 1fr 42px;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 6px 10px;
      border-bottom: 1px solid #24323e;
      font-size: 12px;
    }
    .rank-row:last-child { border-bottom: none; }
    .rank-num {
      color: var(--muted);
      font-weight: 900;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .player {
      min-width: 0;
      overflow: hidden;
    }
    .player-name {
      color: var(--text);
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .player-team {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rank-score {
      color: var(--accent);
      font-size: 16px;
      font-weight: 900;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .empty-stat {
      color: var(--muted);
      padding: 18px 12px;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 1180px) { .grid { grid-template-columns: repeat(3, minmax(240px, 1fr)); } }
    @media (max-width: 880px) {
      body { padding: 12px; }
      .top { align-items: start; flex-direction: column; gap: 8px; }
      .stamp { text-align: left; }
      .countdown-card { grid-template-columns: 1fr; padding: 12px; }
      .countdown-title { font-size: 19px; }
      .countdown-value { font-size: 23px; }
      .today-top { align-items: start; flex-direction: column; gap: 4px; }

      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return { days, hours, minutes, seconds };

      if (["halftime", "half-time", "ht"].includes(status)) return "하프타임";
      if (/^\d+$/.test(status)) return `${status}분`;

    function matchStatusClass(game) {

    function matchScore(game) {

      if (!status || status === "notstarted") return "VS";

    function matchStage(game) {
      if (game.group) return `${game.group}조`;
      const labels = {

      };
      const key = String(game.type || "").toLowerCase().replace(/\s+/g, "_");

    function fifaText(value) {
      if (!Array.isArray(value)) return "";
      const entry = value.find((item) => String(item.Locale || "").toLowerCase().startsWith("en")) || value[0] || {};
      return entry.Description || "";
    }

    function stripMarks(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function normalizeTeamName(value) {
      const name = stripMarks(value)
        .toLowerCase()
        .replace(/&/g, " and ")
        .replace(/[^a-z0-9]+/g, " ")
        .trim()
        .replace(/\s+/g, " ");
      const aliases = {
        "bosnia herzegovina": "bosnia and herzegovina",
        "cabo verde": "cape verde",
        "cote d ivoire": "ivory coast",
        "cote divoire": "ivory coast",
        "czech republic": "czechia",
        "congo dr": "congo dr",
        "democratic republic of the congo": "congo dr",
        "dr congo": "congo dr",
        "ir iran": "iran",
        "korea republic": "south korea",
        "turkey": "turkiye",
        "united states": "usa",
        "united states of america": "usa"
      };
      return aliases[name] || name;
    }

    async function fetchFifaJson(path) {
      const response = await fetch(`${FIFA_CLIENT.apiBase}/${path}`, {
        cache: "no-store",
        headers: { "accept": "application/json" }
      });
      if (!response.ok) throw new Error(`FIFA ${path} ${response.status}`);
      return response.json();
    }

    async function fetchJsonUrl(url) {
      const response = await fetch(url, {
        cache: "no-store",
        headers: { "accept": "application/json" }
      });
      if (!response.ok) throw new Error(`${url} ${response.status}`);
      return response.json();
    }

    function fifaScore(match, side) {
      const teamKey = side === "home" ? "HomeTeam" : "AwayTeam";
      const calendarKey = side === "home" ? "HomeTeamScore" : "AwayTeamScore";
      const value = match && (match[calendarKey] ?? (match[teamKey] && match[teamKey].Score));
      return Number.isFinite(Number(value)) ? Number(value) : null;
    }

    function fifaStatusValue(match) {
      const status = Number(match && match.MatchStatus);
      const resultType = Number(match && match.ResultType);
      const hasScore = fifaScore(match, "home") !== null && fifaScore(match, "away") !== null;
      if ((status === 0 || resultType > 0) && hasScore) return "finished";
      if (status === 12) return "lineups";
      if (status === 3) {
        const minute = String(match.MatchTime || "").replace(/[^\d+]/g, "");
        return minute || "live";
      }
      return "notstarted";
    }

    function mergeFifaMatchIntoGame(game, match) {
      const homeScore = fifaScore(match, "home");
      const awayScore = fifaScore(match, "away");
      const status = fifaStatusValue(match);
      let changed = false;

      if (homeScore !== null && String(game.home_score) !== String(homeScore)) {
        game.home_score = String(homeScore);
        changed = true;
      }
      if (awayScore !== null && String(game.away_score) !== String(awayScore)) {
        game.away_score = String(awayScore);
        changed = true;
      }
      if (game.time_elapsed !== status) {
        game.time_elapsed = status;
        changed = true;
      }
      const finished = status === "finished" ? "TRUE" : "FALSE";
      if (game.finished !== finished) {
        game.finished = finished;
        changed = true;
      }
      return changed;
    }

    function positionLabel(position) {
      return { 0: "GK", 1: "DF", 2: "MF", 3: "FW" }[position] || "";
    }

    function fifaPlayer(player) {
      return {
        name: fifaText(player.PlayerName) || fifaText(player.ShortName) || String(player.IdPlayer || ""),
        shortName: fifaText(player.ShortName),
        number: player.ShirtNumber || "",
        position: positionLabel(player.Position),
        captain: Boolean(player.Captain),
        fifaId: player.IdPlayer || "",
        image: player.PlayerPicture && player.PlayerPicture.PictureUrl || ""
      };
    }

    function fifaTeamLineup(team) {
      const players = Array.isArray(team && team.Players) ? team.Players : [];
      const coaches = Array.isArray(team && team.Coaches) ? team.Coaches : [];
      return {
        team: fifaText(team && team.TeamName),
        code: team && team.Abbreviation || "",
        formation: team && team.Tactics || "",
        coach: fifaText(coaches[0] && coaches[0].Name) || fifaText(coaches[0] && coaches[0].Alias),
        starters: players.filter((player) => player.Status === 1).map(fifaPlayer),
        substitutes: players.filter((player) => player.Status === 2).map(fifaPlayer)
      };
    }

    function indexFifaMatches(matches) {
      const byTeams = new Map();
      for (const match of matches) {
        const home = normalizeTeamName(fifaText(match.Home && match.Home.TeamName));
        const away = normalizeTeamName(fifaText(match.Away && match.Away.TeamName));
        if (!home || !away) continue;
        byTeams.set(`${home}::${away}`, match);
        byTeams.set(`${away}::${home}`, match);
      }
      return byTeams;
    }

    function teamIdByNormalizedName(data) {
      const byName = new Map();
      for (const team of data.teams.teams || []) {
        const normalized = normalizeTeamName(team.name_en);
        if (normalized) byName.set(normalized, String(team.id));
      }
      return byName;
    }

    function blankStanding(team) {
      return {
        team_id: String(team.id),
        mp: "0",
        w: "0",
        l: "0",
        d: "0",
        pts: "0",
        gf: "0",
        ga: "0",
        gd: "0"
      };
    }

    function addStandingResult(row, gf, ga) {
      const mp = Number(row.mp) + 1;
      const w = Number(row.w) + (gf > ga ? 1 : 0);
      const d = Number(row.d) + (gf === ga ? 1 : 0);
      const l = Number(row.l) + (gf < ga ? 1 : 0);
      const totalGf = Number(row.gf) + gf;
      const totalGa = Number(row.ga) + ga;
      row.mp = String(mp);
      row.w = String(w);
      row.d = String(d);
      row.l = String(l);
      row.pts = String(w * 3 + d);
      row.gf = String(totalGf);
      row.ga = String(totalGa);
      row.gd = String(totalGf - totalGa);
    }

    function groupLetter(match) {
      const found = fifaText(match.GroupName).match(/\bGroup\s+([A-L])\b/i);
      return found ? found[1].toUpperCase() : "";
    }

    function rebuildGroupsFromFifa(data, matches) {
      if (!data || !data.groups || !data.teams) return;
      const byName = teamIdByNormalizedName(data);
      const byGroup = new Map();

      for (const team of data.teams.teams || []) {
        const group = String(team.groups || "").toUpperCase();
        if (!group) continue;
        if (!byGroup.has(group)) byGroup.set(group, new Map());
        byGroup.get(group).set(String(team.id), blankStanding(team));
      }

      for (const match of matches) {
        const group = groupLetter(match);
        const homeScore = fifaScore(match, "home");
        const awayScore = fifaScore(match, "away");
        const done = fifaText(match.StageName).toLowerCase() === "first stage" &&
          group && Number(match.ResultType) > 0 && homeScore !== null && awayScore !== null;
        if (!done) continue;

        const homeId = byName.get(normalizeTeamName(fifaText(match.Home && match.Home.TeamName)));
        const awayId = byName.get(normalizeTeamName(fifaText(match.Away && match.Away.TeamName)));
        const rows = byGroup.get(group);
        if (!homeId || !awayId || !rows || !rows.has(homeId) || !rows.has(awayId)) continue;

        addStandingResult(rows.get(homeId), homeScore, awayScore);
        addStandingResult(rows.get(awayId), awayScore, homeScore);
      }

      data.groups.groups = Array.from(byGroup.entries())
        .sort(([a], [b]) => a.localeCompare(b))
        .map(([name, rows]) => ({
          name,
          teams: Array.from(rows.values()).sort((a, b) =>
            Number(b.pts) - Number(a.pts) ||
            Number(b.gd) - Number(a.gd) ||
            Number(b.gf) - Number(a.gf) ||
            Number(a.team_id) - Number(b.team_id)
          )
        }));
    }

    function matchNeedsLiveFetch(match, now = new Date()) {
      const kickoff = new Date(match.Date);
      if (!Number.isFinite(kickoff.getTime())) return false;
      const matchStatus = Number(match.MatchStatus);
      const isLineupOrLive = [3, 11, 12].includes(matchStatus);
      const hoursFromKickoff = (kickoff.getTime() - now.getTime()) / 36e5;
      return isLineupOrLive || (hoursFromKickoff >= -30 && hoursFromKickoff <= 48);
    }

    function playerPictureUrl(player) {
      return player && player.PlayerPicture && player.PlayerPicture.PictureUrl || player && player.PictureUrl || "";
    }

    function findLivePlayerByFeedId(live, feedId) {
      if (!feedId) return null;
      const id = String(feedId);
      const players = [
        ...((live && live.HomeTeam && Array.isArray(live.HomeTeam.Players)) ? live.HomeTeam.Players : []),
        ...((live && live.AwayTeam && Array.isArray(live.AwayTeam.Players)) ? live.AwayTeam.Players : [])
      ];
      return players.find((player) => String(player.IdPlayer || "") === id) || null;
    }

    async function fetchPotmData() {
      const [games, players] = await Promise.all([
        fetchJsonUrl(FIFA_CLIENT.potmGamesUrl),
        fetchJsonUrl(FIFA_CLIENT.potmPlayersUrl)
      ]);
      return {
        games: Array.isArray(games) ? games : [],
        playerMap: new Map((Array.isArray(players) ? players : []).map((player) => [String(player.id), player]))
      };
    }

    function indexPotmMatches(matches) {
      const byTeams = new Map();
      for (const match of matches || []) {
        const home = normalizeTeamName(match.homeSquadName);
        const away = normalizeTeamName(match.awaySquadName);
        const time = Date.parse(match.date);
        if (!home || !away) continue;
        const entry = { match, time: Number.isFinite(time) ? time : 0 };
        for (const key of [`${home}::${away}`, `${away}::${home}`]) {
          if (!byTeams.has(key)) byTeams.set(key, []);
          byTeams.get(key).push(entry);
        }
      }
      return byTeams;
    }

    function findPotmMatch(index, match) {
      const home = normalizeTeamName(fifaText(match.Home && match.Home.TeamName));
      const away = normalizeTeamName(fifaText(match.Away && match.Away.TeamName));
      const candidates = index.get(`${home}::${away}`) || [];
      if (!candidates.length) return null;
      if (candidates.length === 1) return candidates[0].match;

      const kickoff = Date.parse(match.Date);
      if (!Number.isFinite(kickoff)) return candidates[0].match;

      const best = candidates
        .map((candidate) => ({ ...candidate, diff: Math.abs(candidate.time - kickoff) }))
        .sort((a, b) => a.diff - b.diff)[0];
      return best && best.diff <= 12 * 60 * 60 * 1000 ? best.match : null;
    }

    function potmPayload(match, playerMap, livePlayer, fetchedAt) {
      if (!match || !match.winnerId || !match.winnerName) return null;
      const player = playerMap.get(String(match.winnerId)) || {};
      const name = player.knownName || match.winnerName || player.name || player.shortName || "";
      if (!name) return null;

      return {
        provider: "FIFA POTM",
        fetchedAt,
        status: match.status || "",
        matchId: match.id || "",
        matchFeedId: match.feedId || match.fifaId || "",
        playerId: match.winnerId,
        playerFeedId: player.feedId || "",
        name,
        shortName: player.shortName || match.winnerName || name,
        teamCode: player.squadAbbreviation || "",
        position: player.position || "",
        image: playerPictureUrl(livePlayer),
        url: FIFA_CLIENT.potmPageUrl
      };
    }

    function mergePotmIntoGame(game, potmMatch, playerMap, livePlayer, fetchedAt = new Date().toISOString()) {
      const payload = potmPayload(potmMatch, playerMap, livePlayer, fetchedAt);
      if (!payload) return false;

      const before = JSON.stringify(game.potm || null);
      const previousImage = game.potm && game.potm.image || "";
      game.potm = {
        ...(game.potm || {}),
        ...payload,
        image: payload.image || previousImage
      };
      return JSON.stringify(game.potm) !== before;
    }

    function enrichPotmImageFromLive(game, live) {
      if (!game.potm || !game.potm.playerFeedId) return false;
      const player = findLivePlayerByFeedId(live, game.potm.playerFeedId);
      const image = playerPictureUrl(player);
      if (!image || game.potm.image === image) return false;
      game.potm.image = image;
      return true;
    }

    async function refreshFifaDataNow() {
      const data = window.WC2026_LIVE_DATA;
      const games = data && data.games && Array.isArray(data.games.games) ? data.games.games : [];
      if (!games.length) return false;

      const query = new URLSearchParams({
        idCompetition: FIFA_CLIENT.competitionId,
        idSeason: FIFA_CLIENT.seasonId,
        language: FIFA_CLIENT.language,
        count: "200"
      });
      const calendar = await fetchFifaJson(`calendar/matches?${query}`);
      const matches = Array.isArray(calendar.Results) ? calendar.Results : [];
      const matchesByTeams = indexFifaMatches(matches);
      let potmData = null;
      let potmError = "";
      let changed = false;

      rebuildGroupsFromFifa(data, matches);

      try {
        potmData = await fetchPotmData();
      } catch (error) {
        potmError = error.message;
        console.warn("FIFA POTM refresh failed", error);
      }

      const potmIndex = potmData ? indexPotmMatches(potmData.games) : new Map();

      const liveTargets = [];
      for (const game of games) {
        const home = normalizeTeamName(game.home_team_name_en);
        const away = normalizeTeamName(game.away_team_name_en);
        const fifaMatch = matchesByTeams.get(`${home}::${away}`);
        if (!fifaMatch) continue;

        game.official_match = {
          provider: "FIFA",
          idCompetition: fifaMatch.IdCompetition,
          idSeason: fifaMatch.IdSeason,
          idStage: fifaMatch.IdStage,
          idMatch: fifaMatch.IdMatch,
          matchStatus: fifaMatch.MatchStatus,
          url: fifaMatchUrl(fifaMatch),
          clientFetchedAt: new Date().toISOString()
        };
        changed = mergeFifaMatchIntoGame(game, fifaMatch) || changed;
        const potmMatch = findPotmMatch(potmIndex, fifaMatch);
        if (potmMatch) {
          changed = mergePotmIntoGame(game, potmMatch, potmData.playerMap, null, game.official_match.clientFetchedAt) || changed;
        }
        if (matchNeedsLiveFetch(fifaMatch)) liveTargets.push({ game, fifaMatch });
      }

      await Promise.allSettled(liveTargets.map(async ({ game, fifaMatch }) => {
        const live = await fetchFifaJson(
          `live/football/${fifaMatch.IdCompetition}/${fifaMatch.IdSeason}/${fifaMatch.IdStage}/${fifaMatch.IdMatch}?language=${FIFA_CLIENT.language}`
        );
        changed = mergeFifaMatchIntoGame(game, live) || changed;
        game.official_match.matchStatus = live.MatchStatus ?? fifaMatch.MatchStatus;
        game.official_match.clientFetchedAt = new Date().toISOString();
        changed = enrichPotmImageFromLive(game, live) || changed;

        const homeLineup = fifaTeamLineup(live.HomeTeam);
        const awayLineup = fifaTeamLineup(live.AwayTeam);
        if (homeLineup.starters.length || awayLineup.starters.length) {
          game.official_lineups = {
            provider: "FIFA",
            fetchedAt: game.official_match.clientFetchedAt,
            url: fifaMatchUrl(fifaMatch),
            home: homeLineup,
            away: awayLineup
          };
          changed = true;
        }
      }));

      data.fifa = {
        ...(data.fifa || {}),
        provider: "FIFA",
        clientFetchedAt: new Date().toISOString(),
        clientLiveCheckedCount: liveTargets.length,
        potmMatchCount: games.filter((game) => game.potm).length
      };
      data.potm = {
        ...(data.potm || {}),
        provider: "FIFA POTM",
        pageUrl: FIFA_CLIENT.potmPageUrl,
        clientFetchedAt: new Date().toISOString(),
        matchCount: potmData && potmData.games.length || data.potm && data.potm.matchCount || 0,
        attachedCount: games.filter((game) => game.potm).length,
        ...(potmError ? { error: potmError } : {})
      };
      return changed || matches.length > 0;
    }

    function gameTeam(game, side) {

    function staticMatchRows() {

        const [homeName, awayName] = teams.split(" 대 ");

        return {
          raw: null,
          kstDate,
          dateKey: kstDateKey(kstDate),
          home: { team: homeName || "미정", flag: STATIC_FLAGS[homeName] || "", code: STATIC_CODES[homeName] || "" },

          statusClass: "",

    function renderTodayMatches(live, now = new Date()) {
      const root = document.getElementById("todayMatches");
      const sub = document.getElementById("todayMatchSub");
      const count = document.getElementById("todayMatchCount");
      if (!root || !sub || !count) return;

      const liveRows = liveMatchRows();
      const rows = liveRows.length ? liveRows : staticMatchRows();
      const nowKst = kstClockDate(now);
      const todayKey = kstDateKey(nowKst);
      let visible = rows.filter((row) => row.dateKey === todayKey);
      let mode = "today";

      if (!visible.length) {
        const upcoming = rows.filter((row) => row.kstDate >= nowKst);
        if (upcoming.length) {
          const nextKey = upcoming[0].dateKey;
          visible = rows.filter((row) => row.dateKey === nextKey);
          mode = "next";
        }
      }

      if (!visible.length) {
        TODAY_MATCH_ROWS = [];
        sub.textContent = "한국시간 기준";
        count.textContent = "오늘 0경기";
        root.innerHTML = `<div class="today-empty">오늘 예정된 경기가 없습니다.</div>`;
        return;
      }

      TODAY_MATCH_ROWS = visible;
      const label = formatKstDate(visible[0].kstDate);
      sub.textContent = mode === "today" ? `${label} · 한국시간` : `다음 경기일 · ${label} · 한국시간`;
      count.textContent = `${mode === "today" ? "오늘" : "다음"} ${visible.length}경기`;
      root.innerHTML = visible.map(todayMatchCard).join("");

    function playerEntry(value) {
      if (value == null) return null;
      if (typeof value === "string" || typeof value === "number") {
        const name = cleanPlayerName(value);
        return name ? { name, meta: "" } : null;
      }

      const name = cleanPlayerName(
        value.name || value.player || value.player_name || value.name_en ||
        value.full_name || value.fullName || value.label || ""
      );
      if (!name) return null;

      const number = value.number || value.no || value.shirt || value.shirt_number || value.jersey || value.jersey_number;
      const position = value.position || value.pos || value.role;
      const captain = value.captain ? "C" : "";
      const meta = [number ? `#${number}` : "", position || "", captain].filter(Boolean).join(" · ");
      return { name, meta };
    }

    function parseLineupValue(value) {
      if (value == null) return [];

      if (typeof value === "string") {
        const text = value.trim();
        if (!text || ["null", "undefined", "[]", "{}"].includes(text.toLowerCase())) return [];
        if (/^[\[{]/.test(text)) {
          try {
            return parseLineupValue(JSON.parse(text));
          } catch (_) {
            return [];
          }
        }
        return text
          .split(/\r?\n|,|;/)
          .map((item) => playerEntry(item))
          .filter(Boolean);
      }

      if (Array.isArray(value)) {
        return value.map((item) => playerEntry(item)).filter(Boolean);
      }

      if (typeof value === "object") {
        for (const key of ["starting", "starters", "starting11", "starting_11", "lineup", "players", "squad"]) {
          if (Array.isArray(value[key]) || typeof value[key] === "string") {
            const parsed = parseLineupValue(value[key]);
            if (parsed.length) return parsed;
          }
        }
        const single = playerEntry(value);
        if (single) return [single];
        return Object.values(value).flatMap((item) => parseLineupValue(item)).filter(Boolean);
      }

      return [];
    }

    function lineupFor(row, side) {
      const game = row && row.raw;
      if (!game) return [];

      const prefix = side === "home" ? "home" : "away";
      const candidates = [
        game.official_lineups && game.official_lineups[prefix],
        game[`${prefix}_lineup`],
        game[`${prefix}_lineups`],
        game[`${prefix}_starting_lineup`],
        game[`${prefix}_starting11`],
        game[`${prefix}_starting_11`],
        game[`${prefix}_players`],
        game[`${prefix}_squad`],
        game[`${prefix}_team_lineup`],
        game.lineups && game.lineups[prefix],
        game.lineup && game.lineup[prefix],
        game.starting_lineups && game.starting_lineups[prefix],
        game.starting11 && game.starting11[prefix]
      ];

      for (const candidate of candidates) {
        const parsed = parseLineupValue(candidate);
        if (parsed.length) return parsed;
      }
      return [];
    }

    function positionLineup(anchor) {
      const modal = document.getElementById("lineupModal");
      const dialog = modal && modal.querySelector(".lineup-dialog");
      if (!anchor || !dialog) return;

      const rect = anchor.getBoundingClientRect();
      const gap = 8;
      const margin = 14;
      const width = dialog.offsetWidth || Math.min(420, window.innerWidth - margin * 2);
      const height = dialog.offsetHeight || 320;

      let left = rect.left + rect.width / 2 - width / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - width - margin));

      let top = rect.bottom + gap;
      if (top + height > window.innerHeight - margin) {
        top = rect.top - height - gap;
      }
      top = Math.max(margin, top);

      dialog.style.left = `${Math.round(left)}px`;
      dialog.style.top = `${Math.round(top)}px`;
    }

    function cancelLineupClose() {
      if (LINEUP_CLOSE_TIMER) {
        clearTimeout(LINEUP_CLOSE_TIMER);
        LINEUP_CLOSE_TIMER = null;
      }
    }

    function scheduleLineupClose(delay = 180) {
      cancelLineupClose();
      LINEUP_CLOSE_TIMER = setTimeout(closeLineup, delay);
    }

    function showLineup(matchIndex, side, anchor) {
      const row = TODAY_MATCH_ROWS[Number(matchIndex)];
      if (!row || !row[side]) return;

      const modal = document.getElementById("lineupModal");
      const title = document.getElementById("lineupTitle");
      const meta = document.getElementById("lineupMeta");
      const team = document.getElementById("lineupTeam");
      const content = document.getElementById("lineupContent");
      const close = document.getElementById("lineupClose");
      if (!modal || !title || !meta || !team || !content) return;

      cancelLineupClose();
      ACTIVE_LINEUP_TRIGGER = anchor || null;

      const lineup = lineupFor(row, side);
      const selectedTeam = row[side];
      title.textContent = "선발 라인업";
      meta.textContent = `${formatKstTime(row.kstDate)} · ${row.stage} · ${row.status} · ${row.score}`;
      team.innerHTML = teamCell(selectedTeam);

      if (lineup.length) {
        content.innerHTML = `
          <ol class="lineup-list">
            ${lineup.map((player) => `
              <li class="lineup-player">
                <span class="lineup-player-name">${esc(player.name)}</span>
                ${player.meta ? `<span class="lineup-player-meta">${esc(player.meta)}</span>` : ""}
              </li>
            `).join("")}
          </ol>
        `;
      } else {
        const message = row.raw
          ? "아직 공개 API에 이 팀의 선발 라인업 데이터가 없습니다. 라인업이 제공되기 시작하면 이 창에 자동으로 표시됩니다."
          : "정적 일정 데이터에는 선발 라인업이 포함되어 있지 않습니다. 경기 데이터가 갱신되면 다시 확인해주세요.";
        content.innerHTML = `<div class="lineup-empty">${message}</div>`;
      }

      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      positionLineup(anchor);
    }

    function closeLineup() {
      const modal = document.getElementById("lineupModal");
      if (!modal) return;
      cancelLineupClose();
      ACTIVE_LINEUP_TRIGGER = null;
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");
    }

    function bindLineupEvents() {
      const root = document.getElementById("todayMatches");
      if (root && !root.dataset.lineupBound) {
        root.addEventListener("pointerover", (event) => {
          if (event.pointerType === "touch") return;
          const trigger = event.target.closest(".lineup-trigger");
          if (!trigger || trigger.contains(event.relatedTarget)) return;
          showLineup(trigger.dataset.matchIndex, trigger.dataset.side, trigger);
        });
        root.addEventListener("pointerout", (event) => {
          if (event.pointerType === "touch") return;
          const trigger = event.target.closest(".lineup-trigger");
          if (!trigger || trigger.contains(event.relatedTarget)) return;
          scheduleLineupClose();
        });
        root.addEventListener("focusin", (event) => {
          const trigger = event.target.closest(".lineup-trigger");
          if (!trigger) return;
          showLineup(trigger.dataset.matchIndex, trigger.dataset.side, trigger);
        });
        root.addEventListener("focusout", (event) => {
          const trigger = event.target.closest(".lineup-trigger");
          if (!trigger || trigger.contains(event.relatedTarget)) return;
          scheduleLineupClose();
        });
        root.addEventListener("click", (event) => {
          const trigger = event.target.closest(".lineup-trigger");
          if (!trigger) return;
          showLineup(trigger.dataset.matchIndex, trigger.dataset.side, trigger);
        });
        root.dataset.lineupBound = "true";
      }

      const modal = document.getElementById("lineupModal");
      if (modal && !modal.dataset.lineupBound) {
        const dialog = modal.querySelector(".lineup-dialog");
        if (dialog) {
          dialog.addEventListener("pointerenter", cancelLineupClose);
          dialog.addEventListener("pointerleave", () => scheduleLineupClose(220));
        }
        modal.addEventListener("click", (event) => {
          if (event.target.id === "lineupModal" || event.target.id === "lineupClose") closeLineup();
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closeLineup();
        });
        window.addEventListener("resize", () => {
          if (ACTIVE_LINEUP_TRIGGER) positionLineup(ACTIVE_LINEUP_TRIGGER);
        });
        modal.dataset.lineupBound = "true";
      }
    }

    function liveStandings() {
      const data = window.WC2026_LIVE_DATA;
      if (!data || !data.groups || !data.teams) return null;

      const teams = {};
      for (const t of data.teams.teams || []) {
        const name = teamName(t.name_en);
        teams[String(t.id)] = {
          name,
          flag: t.flag || STATIC_FLAGS[name] || "",
          code: t.fifa_code || STATIC_CODES[name] || ""
        };
      }

      const standings = {};
      for (const group of data.groups.groups || []) {
        const letter = String(group.name || "").toUpperCase();
        if (!GROUPS[letter]) continue;
        standings[letter] = (group.teams || []).map((row, index) => {
          const team = teams[String(row.team_id)] || {};
          const fallbackName = GROUPS[letter][index] || String(row.team_id || "");
          const name = team.name || fallbackName;
          return {
            team: name,
            flag: team.flag || STATIC_FLAGS[name] || "",
            code: team.code || STATIC_CODES[name] || "",
            p: num(row.mp),
            w: num(row.w),
            d: num(row.d),
            l: num(row.l),
            gd: num(row.gd),
            pts: num(row.pts),
            gf: num(row.gf)
          };
        }).sort((a, b) =>
          b.pts - a.pts ||
          b.gd - a.gd ||
          b.gf - a.gf ||
          a.team.localeCompare(b.team, "ko")
        );
      }

      return {
        standings,
        fetchedAt: data.fetchedAt || "",
        clientFetchedAt: data.fifa && data.fifa.clientFetchedAt || ""
      };
    }

    function rowsForGroup(letter, live) {
      if (live && live.standings[letter] && live.standings[letter].length) {
        return live.standings[letter];
      }
      return GROUPS[letter].map((team) => ({
        team,
        flag: STATIC_FLAGS[team] || "",
        code: STATIC_CODES[team] || "",
        p: 0,
        w: 0,
        d: 0,
        l: 0,
        gd: 0,
        pts: 0
      }));
    }

    function fixtureKstDate(fixture) {
      const raw = String(fixture && fixture[1] || "");
      const found = raw.match(/^(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})$/);
      if (!found) return null;
      const [, month, day, hour, minute] = found;
      return new Date(
        2026,
        Number(month) - 1,
        Number(day),
        Number(hour),
        Number(minute)
      );
    }

    function fixtureIsDone(fixture, now = new Date()) {
      const kickoff = fixtureKstDate(fixture);
      if (!kickoff || !Number.isFinite(kickoff.getTime())) return false;
      const estimatedEnd = new Date(kickoff.getTime() + 150 * 60 * 1000);
      return now >= estimatedEnd;
    }

    function fixtureTeams(fixture) {
      return String(fixture && fixture[2] || "")
        .split(" 대 ")
        .map((team) => team.trim());
    }

    function fixtureLiveGame(fixture) {
      const data = window.WC2026_LIVE_DATA;
      const games = data && data.games && Array.isArray(data.games.games) ? data.games.games : [];
      const group = String(fixture && fixture[0] || "").toUpperCase();
      const [homeName, awayName] = fixtureTeams(fixture);

      return games.find((game) => {
        const sameGroup = String(game.group || "").toUpperCase() === group;
        const home = teamName(game.home_team_name_en || "");
        const away = teamName(game.away_team_name_en || "");
        return sameGroup && home === homeName && away === awayName;
      });
    }

    function shortResultTeam(team) {
      return ({
        "남아프리카공화국": "남아공",
        "보스니아 헤르체고비나": "보스니아",
        "콩고민주공화국": "콩고DR",
        "사우디아라비아": "사우디"
      })[team] || team;
    }

    function fixtureResult(fixture) {
      const game = fixtureLiveGame(fixture);
      const fallbackDone = fixtureIsDone(fixture);
      if (!game) return { done: fallbackDone, score: "", winner: "" };

      const status = String(game.time_elapsed || "").toLowerCase();
      const done = String(game.finished || "").toUpperCase() === "TRUE" ||
        ["finished", "fulltime", "full-time", "ft"].includes(status);
      const hasScore = done || (!["", "notstarted", "lineups"].includes(status) && Number.isFinite(Number(game.home_score)) && Number.isFinite(Number(game.away_score)));
      if (!hasScore) return { done: done || fallbackDone, score: "", winner: "" };

      const homeScore = num(game.home_score);
      const awayScore = num(game.away_score);
      const [homeName, awayName] = fixtureTeams(fixture);
      const winner =
        homeScore === awayScore ? "무승부" :
        homeScore > awayScore ? `${shortResultTeam(homeName)} 승` :
        `${shortResultTeam(awayName)} 승`;

      return {
        done: done || fallbackDone,
        score: `${homeScore}-${awayScore}`,
        winner: done ? winner : "진행 중"
      };
    }

    function renderGroups(live) {
      const root = document.getElementById("groups");
      root.innerHTML = Object.keys(GROUPS).map((letter) => {
        const groupRows = rowsForGroup(letter, live);
        const played = Math.round(groupRows.reduce((sum, row) => sum + num(row.p), 0) / 2);
        const rows = groupRows.map((row, index) => {
          const cls = index < 2 ? "qual" : index === 2 ? "third" : "";
          const gd = num(row.gd) > 0 ? `+${num(row.gd)}` : String(num(row.gd));
          return `<tr class="${cls}">
            <td class="team">${teamCell(row)}</td>
            <td class="num">${num(row.p)}</td>
            <td class="num">${num(row.w)}</td>
            <td class="num">${num(row.d)}</td>
            <td class="num">${num(row.l)}</td>
            <td class="num">${esc(gd)}</td>
            <td class="pts">${num(row.pts)}</td>
          </tr>`;
        }).join("");

        const matches = FIXTURES.filter((m) => m[0] === letter).slice(0, 4).map((m) => {
          const result = fixtureResult(m);
          const done = result.done;
          return `<div class="match${done ? " done" : ""}">
            <span class="time">${esc(m[1])}</span>
            <span class="teams">${esc(m[2])}</span>
            ${result.score ? `<span class="match-score">${esc(result.score)}</span>` : ""}
            ${result.winner ? `<span class="match-winner">${esc(result.winner)}</span>` : done ? `<span class="match-badge">완료</span>` : ""}
          </div>`;
        }).join("");

        return `<article class="group">
          <div class="group-head">
            <div class="group-name">${letter}조</div>
            <div class="group-status">${played}/6 경기</div>
          </div>
          <table>
            <thead>
              <tr><th class="team">대표팀</th><th class="num">P</th><th class="num">W</th><th class="num">D</th><th class="num">L</th><th class="num">GD</th><th class="pts">Pts</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="matches">
            <div class="matches-title">주요 일정</div>
            ${matches}
          </div>
        </article>`;
      }).join("");
    }

    function cleanPlayerName(value) {
      return String(value || "")
        .replace(/^[\s\\"'`“”‘’{}\[\]]+|[\s\\"'`“”‘’{}\[\]]+$/g, "")
        .replace(/[\\"“”]/g, "")
        .replace(/\([^)]*\d+[^)]*\)/g, "")
        .replace(/\b\d+\+?\d*'?/g, "")
        .replace(/\b(PEN|Penalty|penalty|OG|Own Goal|own goal)\b/g, "")
        .replace(/\s+/g, " ")
        .replace(/^[\s\\"'`“”‘’{}\[\]]+|[\s\\"'`“”‘’{}\[\]]+$/g, "")
        .trim();
    }

    function playerNameForTeam(name, team) {
      if (team !== "대한민국") return name;
      return KO_PLAYER_NAME[name] || name;
    }

    function parsePeople(raw) {
      if (raw == null) return [];
      if (Array.isArray(raw)) return raw.map(cleanPlayerName).filter(Boolean);
      if (typeof raw === "object") {
        return Object.values(raw).flatMap(parsePeople).filter(Boolean);
      }

      const text = String(raw).trim();
      if (!text || text === "null" || text === "[]" || text === "-") return [];

      try {
        const parsed = JSON.parse(text);
        if (Array.isArray(parsed)) return parsed.map(cleanPlayerName).filter(Boolean);
        if (parsed && typeof parsed === "object") {
          return Object.values(parsed).flatMap(parsePeople).filter(Boolean);
        }
        return [cleanPlayerName(parsed)].filter(Boolean);
      } catch (_) {
        // Plain scorer strings are expected from the free API.
      }

      return text
        .replace(/[{}\[\]]/g, ",")
        .split(/[,;|،]+/)
        .map(cleanPlayerName)
        .filter(Boolean);
    }

    function addPlayerCount(map, player, team, flag) {
      const name = playerNameForTeam(cleanPlayerName(player), team);
      if (!name) return;
      const key = `${name}__${team}`;
      const current = map.get(key) || { name, team, flag, image: "", position: "", number: "", count: 0 };
      current.count += 1;
      map.set(key, current);
    }

    function parseProfileJson(value) {
      if (!value || typeof value !== "string") return {};
      try {
        return JSON.parse(value);
      } catch (_) {
        return {};
      }
    }

    function normalizePersonName(value) {
      return stripMarks(value)
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .trim()
        .replace(/\s+/g, " ");
    }

    function officialPlayerPhotos() {
      const data = window.WC2026_LIVE_DATA;
      const games = data && data.games && Array.isArray(data.games.games) ? data.games.games : [];
      const photos = [];

      for (const game of games) {
        for (const side of ["home", "away"]) {
          const team = game.official_lineups && game.official_lineups[side];
          const players = [
            ...(team && Array.isArray(team.starters) ? team.starters : []),
            ...(team && Array.isArray(team.substitutes) ? team.substitutes : [])
          ];
          for (const player of players) {
            if (!player.image) continue;
            photos.push({
              image: player.image,
              code: team.code || "",
              names: [player.name, player.shortName].map(normalizePersonName).filter(Boolean)
            });
          }
        }
      }

      return photos;
    }

    function officialImageForRank(row, profile, photos) {
      const code = STATIC_CODES[teamName(row.teamShortName || row.teamName || "")] || "";
      const rawNames = [
        profile.viewName,
        row.playerName,
        row.shortName,
        row.keyword
      ].flatMap((value) => String(value || "").split(","));
      const names = rawNames.map(normalizePersonName).filter(Boolean);
      if (!names.length) return "";

      const sameTeam = photos.filter((photo) => !code || photo.code === code);
      const pool = sameTeam.length ? sameTeam : photos;

      for (const candidate of pool) {
        if (candidate.names.some((photoName) =>
          names.some((name) => photoName === name || photoName.includes(name) || name.includes(photoName))
        )) {
          return candidate.image;
        }
      }
      return "";
    }

    function naverRankings(type) {
      const data = window.WC2026_LIVE_DATA;
      const topPlayers = data && data.naver && data.naver.topPlayers && data.naver.topPlayers.result
        ? data.naver.topPlayers.result.topPlayers
        : [];
      if (!Array.isArray(topPlayers)) return [];

      const stat = type === "goals" ? "goals" : "assists";
      const block = topPlayers.find((item) => item && item.type === stat);
      const rows = block && Array.isArray(block.ranks) ? block.ranks : [];
      const photos = officialPlayerPhotos();

      return rows
        .filter((row) => num(row[stat]) > 0)
        .map((row) => {
          const profile = parseProfileJson(row.profile);
          const officialImage = officialImageForRank(row, profile, photos);
          return {
            rank: num(row.rank) || 0,
            name: cleanPlayerName(row.playerName || row.shortName || ""),
            team: teamName(row.teamShortName || row.teamName || ""),
            flag: row.teamEmblemUrl || "",
            image: officialImage || row.image || profile.image || "",
            fallbackImage: officialImage && row.image ? row.image : "",
            position: row.position || "",
            number: row.backNumber || "",
            count: num(row[stat])
          };
        })
        .filter((row) => row.name && row.team)
        .slice(0, 8);
    }

    function collectRankings(live, type) {
      const data = window.WC2026_LIVE_DATA;
      const games = data && data.games && Array.isArray(data.games.games) ? data.games.games : [];
      const rankings = new Map();

      for (const game of games) {
        const homeTeam = teamName(game.home_team_name_en || "");
        const awayTeam = teamName(game.away_team_name_en || "");
        const homeFlag = STATIC_FLAGS[homeTeam] || "";
        const awayFlag = STATIC_FLAGS[awayTeam] || "";

        if (type === "goals") {
          for (const player of parsePeople(game.home_scorers)) addPlayerCount(rankings, player, homeTeam, homeFlag);
          for (const player of parsePeople(game.away_scorers)) addPlayerCount(rankings, player, awayTeam, awayFlag);
          continue;
        }

        const homeAssistKeys = Object.keys(game).filter((key) => /^home_.*assist/i.test(key));
        const awayAssistKeys = Object.keys(game).filter((key) => /^away_.*assist/i.test(key));
        for (const key of homeAssistKeys) {
          for (const player of parsePeople(game[key])) addPlayerCount(rankings, player, homeTeam, homeFlag);
        }
        for (const key of awayAssistKeys) {
          for (const player of parsePeople(game[key])) addPlayerCount(rankings, player, awayTeam, awayFlag);
        }
      }

      return Array.from(rankings.values())
        .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, "ko"))
        .slice(0, 8);
    }

    function playerInitial(name) {
      return String(name || "").trim().charAt(0).toUpperCase() || "P";
    }

    function leaderImage(row) {
      const initial = playerInitial(row.name);
      if (!row.image) return `<span class="leader-initial">${esc(initial)}</span>`;
      const fallback = row.fallbackImage && row.fallbackImage !== row.image ? row.fallbackImage : "";
      return `<img class="leader-photo" src="${esc(row.image)}" alt="" loading="lazy" data-fallback="${esc(fallback)}" onerror="if(this.dataset.fallback&&!this.dataset.triedFallback){this.dataset.triedFallback='1';this.src=this.dataset.fallback}else{this.replaceWith(Object.assign(document.createElement('span'),{className:'leader-initial',textContent:'${esc(initial)}'}))}">`;
    }

    function leaderCard(row, unit, label) {
      const detail = [row.number ? `#${row.number}` : "", row.position || ""].filter(Boolean).join(" · ");
      return `
        <article class="leader-card">
          ${leaderImage(row)}
          <div class="leader-info">
            <div class="leader-kicker">${esc(label)}</div>
            <div class="leader-name">${esc(row.name)}</div>
            <div class="leader-team">${teamCell({ team: row.team, flag: row.flag })}${detail ? ` · ${esc(detail)}` : ""}</div>
          </div>
          <div class="leader-score">${row.count}<span class="leader-unit">${esc(unit)}</span></div>
        </article>
      `;
    }

    function renderRanking(targetId, noteId, rows, unit, emptyText, leaderLabel) {
      const target = document.getElementById(targetId);
      const note = document.getElementById(noteId);
      note.textContent = rows.length ? `상위 ${rows.length}명` : "데이터 대기 중";

      if (!rows.length) {
        target.innerHTML = `<div class="empty-stat">${esc(emptyText)}</div>`;
        return;
      }

      const [leader, ...rest] = rows;
      const list = rest.map((row, index) => `
        <div class="rank-row">
          <div class="rank-num">${row.rank || index + 2}</div>
          <div class="player">
            <div class="player-name">${esc(row.name)}</div>
            <div class="player-team">${teamCell({ team: row.team, flag: row.flag })}</div>
          </div>
          <div class="rank-score">${row.count}${esc(unit)}</div>
        </div>
      `).join("");
      target.innerHTML = `${leaderCard(leader, unit, leaderLabel)}${list}`;
    }

    function renderStats(live) {
      const naverScorers = naverRankings("goals");
      const naverAssists = naverRankings("assists");
      const scorers = naverScorers.length ? naverScorers : collectRankings(live, "goals");
      const assists = naverAssists.length ? naverAssists : collectRankings(live, "assists");
      renderRanking("scorers", "scorerNote", scorers, "골", "대회 시작 후 득점자가 집계됩니다.", "득점 선두");
      renderRanking("assists", "assistNote", assists, "도움", "공개 API에 도움 데이터가 제공되면 자동 표시됩니다.", "도움 선두");
    }

    function renderKorea() {
      document.getElementById("korea").innerHTML = KOREA.map((m) => `
        <article class="k-card">
          <div class="k-date">${esc(m[0])}</div>
          <div class="k-title">${esc(m[1])}</div>
          <div class="k-meta">${esc(m[2])}</div>
        </article>
      `).join("");
    }

    function renderStatus(live) {
      const el = document.getElementById("dataStatus");
      if (!live || !live.fetchedAt) {
        el.className = "status-static";
        el.textContent = "오프라인 정적 데이터";
        return;
      }
      const source = live.clientFetchedAt ? "FIFA 공식 즉시 확인" : "";
      const date = new Date(live.clientFetchedAt || live.fetchedAt);
      if (!Number.isFinite(date.getTime())) {
        el.className = "status-warn";
        el.textContent = `갱신 시간 확인 필요: ${live.fetchedAt}`;
        return;
      }
      const ageMinutes = Math.max(0, Math.round((Date.now() - date.getTime()) / 60000));
      const state =
        ageMinutes >= 30 ? { cls: "status-stale", text: "갱신 지연" } :
        ageMinutes >= 15 ? { cls: "status-warn", text: "갱신 확인 중" } :
        { cls: "status-ok", text: "자동 갱신 정상" };
      const label = Number.isFinite(date.getTime())
        ? new Intl.DateTimeFormat("ko-KR", {
            month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
          }).format(date)
        : live.fetchedAt;
      el.className = state.cls;
      el.textContent = `${source || state.text}: ${label} · ${ageMinutes}분 전`;
    }

    function startDashboard() {
      startOpeningCountdown();

      document.getElementById("today").textContent = new Intl.DateTimeFormat("ko-KR", {
        year: "numeric", month: "long", day: "numeric", weekday: "short"
      }).format(new Date());

      const live = liveStandings();
      renderTodayMatches(live);
      bindLineupEvents();
      renderStats(live);
      renderGroups(live);
      renderKorea();
      renderStatus(live);

      refreshFifaDataNow()
        .then((updated) => {
          if (!updated) return;
          const refreshed = liveStandings();
          renderTodayMatches(refreshed);
          renderStats(refreshed);
          renderGroups(refreshed);
          renderStatus(refreshed);
          setText("refreshStatus", "FIFA 공식 데이터 즉시 반영 완료");
        })
        .catch((error) => {
          console.warn("FIFA live refresh failed", error);
          setText("refreshStatus", "자동 새로고침 유지 · FIFA 즉시 확인 실패");
        });

      setTimeout(() => {
        window.location.reload();
      }, 5 * 60 * 1000);
    }

    function loadLiveData() {
      const script = document.createElement("script");
      script.src = `wc2026_live_data.js?v=${Date.now()}`;
      script.onload = startDashboard;
      script.onerror = startDashboard;
      document.head.appendChild(script);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", loadLiveData);
    } else {
      loadLiveData();
    }
  </script>
</body>
</html>
